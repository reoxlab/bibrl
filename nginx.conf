server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /herramientas/bibrl {
        return 301 https://$host/herramientas/bibrl/;
    }

    # Assets con hash de Vite: cacheables un año.
    location /herramientas/bibrl/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy same-origin para arXiv (export.arxiv.org no envía cabeceras CORS).
    location /herramientas/bibrl/api/arxiv/ {
        resolver 127.0.0.11 valid=30s;
        set $arxiv_host export.arxiv.org;
        rewrite ^/herramientas/bibrl/api/arxiv/(.*)$ /api/$1 break;
        proxy_pass https://$arxiv_host;
        proxy_ssl_server_name on;
        proxy_set_header Host export.arxiv.org;
        proxy_set_header Accept-Encoding "";
    }

    location /herramientas/bibrl/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /herramientas/bibrl/index.html;
    }

    # La app solo vive bajo /herramientas/bibrl/; fuera de ahí, 404.
    location / {
        return 404;
    }
}
